name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          pyinstaller --onefile --noconsole --name=TAJ_AN_Core_${{ github.ref_name }}_Linux taj_an_poc.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TAJ_AN_Core_${{ github.ref_name }}_Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          pyinstaller --onefile --noconsole --name=TAJ_AN_Core_${{ github.ref_name }}_Windows.exe taj_an_poc.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TAJ_AN_Core_${{ github.ref_name }}_Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
